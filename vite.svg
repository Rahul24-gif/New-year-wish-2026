<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512"
     viewBox="0 0 512 512">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141E30"/>
      <stop offset="100%" stop-color="#243B55"/>
    </linearGradient>

    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="80"
        fill="url(#bg)"/>

  <circle cx="420" cy="90" r="6" fill="#FFD700"/>
  <circle cx="380" cy="130" r="4" fill="#FF5252"/>
  <circle cx="430" cy="140" r="4" fill="#4CAF50"/>

  <text x="256" y="300"
        text-anchor="middle"
        font-size="160"
        font-weight="700"
        fill="url(#txt)"
        filter="url(#glow)"
        font-family="Poppins, Arial, sans-serif">
    2026
  </text>

  <text x="256" y="350"
        text-anchor="middle"
        font-size="32"
        fill="#ffffff"
        opacity="0.9"
        font-family="Poppins, Arial, sans-serif">
    Wishes
  </text>

</svg>
